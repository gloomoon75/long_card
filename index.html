<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>長文切卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#EBEFEC; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#17201C; --muted:#5A6862;
  --line:#D2DAD5; --accent:#15835A; --accent-ink:#FFFFFF; --accent-soft:#DCEFE5;
  --mat:#1D5A43; --mat-grid:rgba(255,255,255,.09); --warn:#A8501B; --warn-soft:#F8E6DA;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 8px 24px rgba(20,40,30,.08);
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#161C19; --surface-2:#1C2420; --ink:#E2EAE5; --muted:#92A098;
    --line:#2A3530; --accent:#3CBD84; --accent-ink:#08170F; --accent-soft:#1A3227;
    --mat:#11352A; --mat-grid:rgba(255,255,255,.06); --warn:#E59A68; --warn-soft:#3A2519;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#161C19; --surface-2:#1C2420; --ink:#E2EAE5; --muted:#92A098;
  --line:#2A3530; --accent:#3CBD84; --accent-ink:#08170F; --accent-soft:#1A3227;
  --mat:#11352A; --mat-grid:rgba(255,255,255,.06); --warn:#E59A68; --warn-soft:#3A2519;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding-inline:16px;min-height:var(--hh);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font-family:var(--display);font-size:24px;font-weight:700;margin:0;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* layout */
.app{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:grid;gap:18px;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"controls" "strip" "cards"}
.controls{grid-area:controls}.strip-col{grid-area:strip;min-width:0}.cards-col{grid-area:cards;min-width:0}
@media (min-width:780px){
  .app{grid-template-columns:minmax(300px,350px) minmax(0,1fr);grid-template-areas:"controls strip" "controls cards"}
  .controls{position:sticky;top:calc(var(--hh) + 12px);align-self:start;max-height:calc(100dvh - var(--hh) - 24px);overflow:auto;padding-right:4px}
}
@media (min-width:1200px){
  .app{grid-template-columns:340px minmax(0,1fr) 290px;grid-template-areas:"controls strip cards"}
  .cards-col{position:sticky;top:calc(var(--hh) + 12px);align-self:start;max-height:calc(100dvh - var(--hh) - 24px);overflow:auto}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.controls{display:grid;gap:14px;align-content:start}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:12.5px}
.hint kbd{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
textarea#src{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:12px;line-height:1.7;font-size:15px}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;align-items:center;gap:10px}
.row label{font-size:13px;color:var(--ink)}
.row output{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:13px}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:7px 10px;width:100%}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;line-height:1.3}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:6px 11px;white-space:nowrap;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:flex;flex-wrap:wrap;gap:12px 20px}
.wh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.wh span{color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:54px;border:1px solid var(--line);border-radius:8px;padding:0;cursor:pointer;overflow:hidden;background:none;display:grid}
.sw i{display:block;height:26px;font-style:normal;font-size:12px;line-height:26px;text-align:center;font-weight:700}
.sw span{font-size:11px;padding:2px 0;background:var(--surface-2);color:var(--muted)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.color{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.color input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2);cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.font-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* strip */
.col-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.col-h h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
.col-h .hint{margin-top:2px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.mat{background-color:var(--mat);
  background-image:linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px);
  background-size:20px 20px;border-radius:12px;padding:24px 16px;display:flex;justify-content:center;min-height:200px}
.strip{position:relative;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:copy;touch-action:pan-y}
.strip canvas{display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.tint{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.seg-label{position:absolute;left:6px;font-family:var(--mono);font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--ink);color:var(--surface);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.86}
.seg-label.full{background:var(--warn);color:#fff}
.cut{position:absolute;left:-8px;right:-8px;height:0;pointer-events:none}
.cut::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.cut::after{content:"";position:absolute;left:0;top:-5px;border:5px solid transparent;border-left:7px solid var(--accent)}
.cut-tools{position:absolute;right:-10px;top:0;transform:translateY(-50%);display:flex;gap:4px;pointer-events:auto}
.cut-tools button{width:34px;height:30px;border-radius:7px;border:1px solid var(--accent);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
.cut-tools .grip{background:var(--accent);color:var(--accent-ink);cursor:ns-resize;touch-action:none}
.cut-tools .del[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.cut.dragging::before{height:3px;top:-1.5px}
.band{position:absolute;left:0;right:0;border-top:1px dashed var(--accent);border-bottom:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.band span{position:absolute;right:6px;bottom:4px;font-size:11px;color:var(--ink);background:var(--surface);padding:1px 6px;border-radius:4px}
.empty{color:#fff;opacity:.8;align-self:center;text-align:center;padding:40px 0}

/* cards */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.thumb{border:0;padding:0;background:none;cursor:pointer;display:grid;gap:6px;text-align:left}
.thumb canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:var(--shadow);border:1px solid var(--line)}
.thumb span{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* export sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);z-index:2}
.sheet-bar .top-in{min-height:58px}
@media (max-width:520px){.sheet-bar .brand{flex-basis:100%}.sheet-bar .btn{flex:1}}
.sheet-list{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:grid;gap:22px}
.sheet-item{display:grid;gap:8px}
.sheet-item img{width:100%;height:auto;display:block;border-radius:8px;box-shadow:var(--shadow)}
.sheet-item .cap{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}

.btns{display:flex;gap:6px;flex-wrap:wrap}
.ocr-body{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:14px}
.ocr-status{display:grid;gap:6px}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.ocr-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:780px){.ocr-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.ocr-imgs{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:8px;padding:8px}
.ocr-imgs img{width:100%;height:auto;display:block;border-radius:4px}
#ocrText{width:100%;min-height:50vh;height:72vh;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;line-height:1.75;font-size:15px}
@media (max-width:779px){.ocr-imgs{max-height:40vh}#ocrText{height:55vh}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:520px){ .brand p{display:none} .stat{order:3;width:100%} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>長文切卡</h1><p>貼上長文，調整切割線，輸出手機圖卡</p></div>
    <div class="stat" id="stat"></div>
    <button class="btn primary" id="exportBtn">輸出圖片</button>
  </div>
</header>

<main class="app">
  <section class="controls" aria-label="文字與設定">
    <div class="panel">
      <div class="sec-h"><h2>文字</h2><div class="btns"><label class="btn small file-btn">從圖片匯入<input type="file" id="ocrFile" accept="image/*" multiple></label><button class="btn small" id="clearBtn">清空</button></div></div>
      <textarea id="src" spellcheck="false" placeholder="在這裡貼上長文⋯"></textarea>
      <p class="hint">用 <kbd>*米字號*</kbd> 夾住的文字會變成淺色（半形 * 或全形 ＊ 都可以）。<span id="count"></span></p>
    </div>

    <div class="panel">
      <div class="sec-h"><h2>圖片尺寸</h2></div>
      <div class="chips" id="sizeChips"></div>
      <div class="wh">
        <input type="number" id="W" min="200" max="4000" step="10" aria-label="寬度（px）">
        <span>×</span>
        <input type="number" id="H" min="200" max="6000" step="10" aria-label="高度（px）">
      </div>
    </div>

    <div class="panel">
      <div class="sec-h"><h2>字體與排版</h2></div>
      <div class="field">
        <label for="family">字體</label>
        <div class="font-row">
          <select id="family"></select>
          <label class="btn small file-btn">上傳字體<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2"></label>
        </div>
      </div>
      <div class="two">
        <div class="field"><span class="lbl">粗細</span>
          <div class="seg" id="weightSeg"><button data-v="400">一般</button><button data-v="700">粗體</button></div></div>
        <div class="field"><span class="lbl">對齊</span>
          <div class="seg" id="alignSeg"><button data-v="left">靠左</button><button data-v="justify">左右</button><button data-v="center">置中</button></div></div>
      </div>
      <div class="row"><label for="size">字級</label><input type="range" id="size" min="20" max="120" step="1"><output id="o-size"></output></div>
      <div class="row"><label for="lh">行高</label><input type="range" id="lh" min="1.1" max="2.6" step="0.05"><output id="o-lh"></output></div>
      <div class="row"><label for="pgap">段落間距</label><input type="range" id="pgap" min="0" max="2.5" step="0.1"><output id="o-pgap"></output></div>
      <div class="row"><label for="padX">左右邊距</label><input type="range" id="padX" min="0" max="320" step="2"><output id="o-padX"></output></div>
      <div class="row"><label for="padY">上下邊距</label><input type="range" id="padY" min="0" max="400" step="2"><output id="o-padY"></output></div>
    </div>

    <div class="panel">
      <div class="sec-h"><h2>顏色</h2></div>
      <div class="swatches" id="swatches"></div>
      <div class="colors">
        <label class="color">底色<input type="color" id="bg"></label>
        <label class="color">深色字<input type="color" id="dark"></label>
        <label class="color">淺色字<input type="color" id="light"></label>
      </div>
      <label class="check"><input type="checkbox" id="pageNum">在右下角顯示頁碼（如 2 / 6）</label>
    </div>
  </section>

  <section class="strip-col" aria-label="切割預覽">
    <div class="col-h">
      <div>
        <h2>切割預覽</h2>
        <p class="hint">拖曳右側 <b>≡</b> 移動切割線・點文字行距之間可新增・按 <b>×</b> 刪除</p>
      </div>
      <button class="btn small" id="autoBtn">重新自動切割</button>
    </div>
    <div class="warn" id="warn" hidden></div>
    <div class="mat" id="mat">
      <div class="strip" id="strip"><div id="chunks"></div><div class="overlay" id="overlay"></div></div>
    </div>
  </section>

  <section class="cards-col" aria-label="圖卡預覽">
    <div class="col-h"><div><h2>圖卡</h2><p class="hint">點圖卡可跳到對應的切割位置</p></div></div>
    <div class="thumbs" id="thumbs"></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bar"><div class="top-in">
    <div class="brand"><h1 id="sheetTitle">圖片</h1></div>
    <button class="btn" id="saveAllBtn">全部儲存</button>
    <button class="btn primary" id="closeSheet">完成</button>
  </div></div>
  <div class="sheet-list" id="sheetList"></div>
</div>
<div class="sheet" id="ocrSheet" hidden>
  <div class="sheet-bar"><div class="top-in">
    <div class="brand"><h1>圖片轉文字</h1></div>
    <button class="btn" id="ocrCancel">取消</button>
    <button class="btn" id="ocrAppend" disabled>加到最後</button>
    <button class="btn primary" id="ocrReplace" disabled>取代目前文字</button>
  </div></div>
  <div class="ocr-body">
    <div class="ocr-status"><p class="hint" id="ocrStatus">準備中⋯</p><div class="bar"><i id="ocrBar"></i></div></div>
    <p class="tip">淺色字會自動用 *米字號* 夾住。辨識難免有錯字，請對照原圖修改後再使用。第一次使用需要下載約 10MB 的中文辨識資料，之後會快很多。</p>
    <div class="ocr-grid">
      <div class="ocr-imgs" id="ocrImgs" aria-label="原圖"></div>
      <textarea id="ocrText" spellcheck="false" aria-label="辨識結果（可編輯）" placeholder="辨識結果會出現在這裡"></textarea>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const DPR = Math.min(2, window.devicePixelRatio || 1);

const SAMPLE = `為什麼長文在手機上讀起來特別累？

手機螢幕窄，一行只能放十幾個字。讀者的眼睛要不停換行，還要一邊滑動一邊記住上一段在說什麼。*這不是讀者不耐煩，是版面讓閱讀變得費力。*

把長文切成圖卡，是在替讀者做一次「分段呼吸」。每一張只承載一個完整的想法，看完一張，停一下，再往下一張。

切的時候有三個原則。

第一，*不要把一句話切成兩半。*讀者翻到下一張時，已經忘了上一句的主詞是誰。

第二，每張的留白要一致。字級、行距、邊距固定下來，整組圖卡才會像同一本小書，而不是一疊截圖。

第三，重點用顏色區分，不必加粗或放大。深色字是正文，*淺色字是旁白、補充或語氣*，讀者一眼就能分出層次。

這個工具會先依照段落自動切割，並盡量不把段落拆開。如果你想讓某一段獨立成一張，就在預覽上拖曳切割線，直到每一張都剛剛好。

最後按「輸出圖片」，把整組圖卡存下來，直接發到社群。*（這段是範例文字，清空後貼上你的長文。）*`;

const FONTS = [
  {id:'Noto Sans TC', label:'思源黑體', stack:'"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif'},
  {id:'Noto Serif TC', label:'思源宋體', stack:'"Noto Serif TC","Songti TC","PMingLiU",serif'},
  {id:'LXGW WenKai TC', label:'霞鶩文楷', stack:'"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif'},
  {id:'Huninn', label:'粉圓體', stack:'"Huninn","PingFang TC",sans-serif'},
  {id:'system', label:'系統字體', stack:'system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif', system:true},
];
const SIZES = [
  {name:'4:5', W:1080, H:1350},
  {name:'3:4', W:1080, H:1440},
  {name:'1:1', W:1080, H:1080},
  {name:'9:16', W:1080, H:1920},
];
const PALETTES = [
  {name:'紙白', bg:'#F7F5F0', dark:'#26282B', light:'#A4A5A1'},
  {name:'純白', bg:'#FFFFFF', dark:'#1C1C1C', light:'#9C9C9C'},
  {name:'夜墨', bg:'#1C1E22', dark:'#ECE9E2', light:'#7A7F88'},
  {name:'霧藍', bg:'#E5EBF1', dark:'#1E2C3B', light:'#8494A7'},
  {name:'抹茶', bg:'#E8EDE0', dark:'#25321E', light:'#8D9B82'},
  {name:'杏桃', bg:'#F4E4D6', dark:'#3B2A1F', light:'#B1937E'},
];
const DEFAULTS = {text:SAMPLE, W:1080, H:1350, family:'Noto Sans TC', weight:400, align:'justify',
  size:46, lh:1.75, pgap:0.9, padX:100, padY:120, bg:'#F7F5F0', dark:'#26282B', light:'#A4A5A1', pageNum:false};

const STORE = 'longcards.v1';
let S = {...DEFAULTS};
try { const saved = JSON.parse(localStorage.getItem(STORE) || 'null'); if (saved) S = {...DEFAULTS, ...saved}; } catch(e) {}
if (!FONTS.find(f => f.id === S.family)) S.family = DEFAULTS.family;

let lines = [], L = 0, total = 0, cap = 0, cuts = [], overflowWarn = false, layoutFontReady = true;

/* ---------- helpers ---------- */
const font = () => FONTS.find(f => f.id === S.family) || FONTS[0];
const fontStr = (size = S.size) => `${S.weight} ${size}px ${font().stack}`;
const mctx = document.createElement('canvas').getContext('2d');
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
let saveT;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} },400); }

/* ---------- parse & wrap ---------- */
const NO_START = new Set([...'，。、；：！？）」』》〉】〕｝…‥—～·・,.;:!?)]}%’”﹂﹄ーぁぃぅぇぉっゃゅょ']);
const NO_END = new Set([...'（「『《〈【〔｛([{‘“﹁﹃']);
const WORDCH = /[A-Za-z0-9À-ɏ'’\-_.,:;!?%&@#/+=$]/;
const WORDSTART = /[A-Za-z0-9À-ɏ]/;
const SENT_END = new Set([...'。！？!?…」』.；;']);

function parse(text){
  text = text.replace(/\r\n?/g, '\n');
  const chars = [];
  const re = /[*＊]([^*＊]+?)[*＊]/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    for (const c of text.slice(last, m.index)) chars.push({c, l:false});
    for (const c of m[1]) chars.push({c, l:true});
    last = re.lastIndex;
  }
  for (const c of text.slice(last)) chars.push({c, l:false});
  const paras = []; let cur = [];
  for (const ch of chars) { if (ch.c === '\n') { paras.push(cur); cur = []; } else cur.push(ch); }
  paras.push(cur);
  return paras;
}

const wcache = new Map();
function measure(t){ let w = wcache.get(t); if (w === undefined) { w = mctx.measureText(t).width; wcache.set(t, w); } return w; }

function tokenize(p, maxW){
  const units = []; let i = 0;
  while (i < p.length) {
    const ch = p[i];
    if (ch.c === ' ' || ch.c === '\t') { units.push({t:' ', l:ch.l, space:true, w:measure(' ')}); i++; continue; }
    if (WORDSTART.test(ch.c)) {
      let t = ch.c, j = i + 1;
      while (j < p.length && WORDCH.test(p[j].c) && p[j].l === ch.l) { t += p[j].c; j++; }
      const w = measure(t);
      if (w > maxW) { for (const c of t) units.push({t:c, l:ch.l, w:measure(c)}); }
      else units.push({t, l:ch.l, w});
      i = j; continue;
    }
    units.push({t:ch.c, l:ch.l, w:measure(ch.c), noStart:NO_START.has(ch.c), noEnd:NO_END.has(ch.c)});
    i++;
  }
  return units;
}

function wrap(units, maxW){
  const out = []; let line = [], w = 0;
  const flush = () => { while (line.length && line[line.length-1].space) line.pop(); if (line.length) out.push(line); line = []; w = 0; };
  for (const u of units) {
    if (u.space && !line.length) continue;
    if (!line.length || w + u.w <= maxW + 0.01) { line.push(u); w += u.w; continue; }
    if (u.space) { flush(); continue; }
    let carry = [];
    if (u.noStart) {
      let k = line.length - 1;
      while (k > 0 && line[k].noStart) k--;
      if (k > 0) carry = line.splice(k);
      else { line.push(u); w += u.w; flush(); continue; }
    }
    while (line.length > 1 && line[line.length-1].noEnd) carry.unshift(line.pop());
    flush();
    line = carry; w = line.reduce((s, x) => s + x.w, 0);
    line.push(u); w += u.w;
  }
  flush();
  return out;
}

function computeLayout(){
  wcache.clear();
  mctx.font = fontStr();
  L = S.size * S.lh;
  const G = S.size * S.pgap;
  const maxW = Math.max(40, S.W - 2 * S.padX);
  cap = Math.max(L, S.H - 2 * S.padY);
  lines = [];
  let y = 0, blanks = 0, first = true;
  for (const p of parse(S.text)) {
    while (p.length && /\s/.test(p[p.length-1].c) && p[p.length-1].c !== '　') p.pop();
    if (!p.length || p.every(ch => /\s/.test(ch.c) && ch.c !== '　')) { blanks++; continue; }
    const wl = wrap(tokenize(p, maxW), maxW);
    wl.forEach((units, idx) => {
      const lastOfPara = idx === wl.length - 1;
      const nat = units.reduce((s, u) => s + u.w, 0);
      let gap = 0, x0 = 0;
      const slack = maxW - nat;
      if (S.align === 'justify' && !lastOfPara && units.length > 1 && slack > 0 && slack < maxW * 0.22) gap = slack / (units.length - 1);
      if (S.align === 'center') x0 = Math.max(0, slack / 2);
      const items = []; let x = x0;
      for (const u of units) { if (!u.space) items.push({x, t:u.t, l:u.l}); x += u.w + gap; }
      const lastT = units.length ? units[units.length-1].t : '';
      if (!first) y += idx === 0 ? G + Math.min(2, Math.max(0, blanks - 1)) * L : 0;
      lines.push({items, y, paraStart: idx === 0, sentEnd: SENT_END.has(lastT.slice(-1))});
      y += L; first = false;
    });
    blanks = 0;
  }
  total = y;
}

const segH = (a, b) => lines[b-1].y + L - lines[a].y;
const segStart = j => j === 0 ? 0 : cuts[j-1];
const segEnd = j => j < cuts.length ? cuts[j] : lines.length;
const segCount = () => lines.length ? cuts.length + 1 : 0;

// Best place to end the card that starts at line a. Returns n if the rest fits.
function bestCut(a){
  const n = lines.length;
  const isParaLast = k => k === n - 1 || lines[k+1].paraStart;
  let e = a + 1;
  while (e < n && segH(a, e + 1) <= cap) e++;
  if (segH(a, e) > cap) overflowWarn = true;
  if (e >= n) return n;
  for (let k = e; k > a; k--) if (lines[k].paraStart && segH(a, k) >= cap * 0.5) return k;
  for (let k = e; k > a; k--) if (lines[k-1].sentEnd && segH(a, k) >= cap * 0.7) return k;
  let best = e;
  if (best - 1 > a && lines[best-1].paraStart) best--;
  else if (best - 1 > a && isParaLast(best) && !lines[best-1].paraStart) best--;
  return best;
}
function autoCut(){
  cuts = []; overflowWarn = false;
  const n = lines.length; if (!n) return;
  let a = 0;
  while (a < n) { const b = bestCut(a); if (b >= n) break; cuts.push(b); a = b; }
}
// Keep `fixed` cuts, then walk the user's later cuts; add cuts only where a card would overflow.
function reflow(fixed, rest){
  const n = lines.length, out = fixed.slice();
  let a = out.length ? out[out.length-1] : 0;
  for (const c of rest) {
    if (c <= a || c >= n) continue;
    while (segH(a, c) > cap) { const b = bestCut(a); out.push(b); a = b; }
    if (c > a) { out.push(c); a = c; }
  }
  while (a < n && segH(a, n) > cap) { const b = bestCut(a); if (b >= n) break; out.push(b); a = b; }
  return out;
}

/* ---------- drawing ---------- */
function drawLines(ctx, a, b, ox, oy, fromY, yMin = -Infinity, yMax = Infinity){
  ctx.font = fontStr(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (let i = a; i < b; i++) {
    const ln = lines[i];
    const top = oy + ln.y - fromY;
    if (top + L < yMin || top > yMax) continue;
    const cy = top + L / 2;
    for (const it of ln.items) { ctx.fillStyle = it.l ? S.light : S.dark; ctx.fillText(it.t, ox + it.x, cy); }
  }
}

function renderCard(ctx, j, sc){
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.fillStyle = S.bg; ctx.fillRect(0, 0, S.W, S.H);
  const a = segStart(j), b = segEnd(j);
  if (b > a) drawLines(ctx, a, b, S.padX, S.padY, lines[a].y);
  if (S.pageNum) {
    const fs = Math.max(14, Math.round(S.size * 0.52));
    ctx.font = `400 ${fs}px ${font().stack}`; ctx.fillStyle = S.light;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${j+1} / ${segCount()}`, S.W - Math.max(S.padX, 40), S.H - Math.max(S.padY / 2, fs));
    ctx.textAlign = 'left';
  }
}

let scale = 1, stripHcard = 0;
const boundaryY = k => S.padY + (lines[k-1].y + L + lines[k].y) / 2;

function renderStrip(){
  const mat = $('mat'), strip = $('strip'), chunks = $('chunks');
  chunks.innerHTML = '';
  if (!lines.length) {
    strip.hidden = true;
    if (!mat.querySelector('.empty')) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = '貼上文字後，這裡會顯示切割預覽'; mat.appendChild(d); }
    return;
  }
  mat.querySelector('.empty')?.remove();
  strip.hidden = false;
  const avail = Math.max(160, mat.clientWidth - 32 - 20);
  const dispW = Math.min(avail, 440);
  scale = dispW / S.W;
  stripHcard = S.padY * 2 + total;
  const cssH = stripHcard * scale;
  strip.style.width = dispW + 'px'; strip.style.height = cssH + 'px';
  const CH = 1024;
  for (let T = 0; T < cssH; T += CH) {
    const h = Math.min(CH, cssH - T);
    const c = document.createElement('canvas');
    c.width = Math.round(dispW * DPR); c.height = Math.max(1, Math.round(h * DPR));
    c.style.width = dispW + 'px'; c.style.height = h + 'px';
    const ctx = c.getContext('2d');
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, -T * DPR);
    const y0 = T / scale, y1 = (T + h) / scale;
    ctx.fillStyle = S.bg; ctx.fillRect(0, y0, S.W, y1 - y0 + 1);
    drawLines(ctx, 0, lines.length, S.padX, S.padY, 0, y0, y1);
    chunks.appendChild(c);
  }
}

/* ---------- overlay: cut lines ---------- */
let cutEls = [], labelEls = [], tintEls = [], dragging = null;

function segTopCard(j){ return j === 0 ? 0 : boundaryY(cuts[j-1]); }
function segBotCard(j){ return j < cuts.length ? boundaryY(cuts[j]) : stripHcard; }
function fillPct(j){ return Math.round(segH(segStart(j), segEnd(j)) / cap * 100); }

function renderOverlay(){
  const ov = $('overlay'); ov.innerHTML = '';
  cutEls = []; labelEls = []; tintEls = [];
  if (!lines.length) return;
  const N = segCount();
  for (let j = 0; j < N; j++) {
    if (j % 2 === 1) { const t = document.createElement('div'); t.className = 'tint'; ov.appendChild(t); tintEls[j] = t; }
    const lb = document.createElement('div'); lb.className = 'seg-label'; ov.appendChild(lb); labelEls[j] = lb;
  }
  cuts.forEach((k, i) => {
    const el = document.createElement('div'); el.className = 'cut';
    el.innerHTML = `<div class="cut-tools">
      <button class="del" aria-label="刪除這條切割線" title="刪除切割線"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
      <button class="grip" aria-label="拖曳移動切割線（可用上下方向鍵）" title="拖曳移動"><svg width="14" height="12" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 2h12M1 6h12M1 10h12"/></svg></button>
    </div>`;
    const grip = el.querySelector('.grip'), del = el.querySelector('.del');
    grip.addEventListener('pointerdown', e => startDrag(e, i, el));
    grip.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const [lo, hi] = rangeFor(i);
      const nk = Math.min(hi, Math.max(lo, cuts[i] + (e.key === 'ArrowUp' ? -1 : 1)));
      if (nk === cuts[i]) return;
      const before = cuts.length;
      cuts = reflow(cuts.slice(0, i).concat(nk), cuts.slice(i + 1));
      if (cuts.length !== before) renderOverlay(); else positionOverlay();
      renderThumbs(); updateStat();
      cutEls[i]?.querySelector('.grip').focus();
    });
    del.addEventListener('click', e => {
      e.stopPropagation();
      const before = cuts.length;
      cuts = reflow(cuts.slice(0, i), cuts.slice(i + 1));
      refreshCuts();
      toast(cuts.length === before ? '合併後放不進一張圖，已自動改切在最接近的位置' : '已刪除切割線');
    });
    ov.appendChild(el); cutEls[i] = el;
  });
  positionOverlay();
}

function positionOverlay(){
  const N = segCount();
  for (let j = 0; j < N; j++) {
    const top = segTopCard(j) * scale, bot = segBotCard(j) * scale;
    if (tintEls[j]) { tintEls[j].style.top = top + 'px'; tintEls[j].style.height = (bot - top) + 'px'; }
    const lb = labelEls[j], pct = fillPct(j);
    lb.textContent = `${j+1}/${N} · ${pct}%`;
    lb.classList.toggle('full', pct > 100);
    lb.style.top = (j === 0 ? top + 6 : top) + 'px';
    lb.style.transform = j === 0 ? '' : 'translateY(-50%)';
  }
  cuts.forEach((k, i) => {
    const el = cutEls[i]; if (!el) return;
    el.style.top = boundaryY(k) * scale + 'px';
  });
}

// A cut can go anywhere after the previous cut, as long as the card above it still fits.
function rangeFor(i){
  const p = segStart(i), n = lines.length, cur = cuts[i];
  let hi = p + 1;
  for (let k = p + 1; k < n && segH(p, k) <= cap; k++) hi = k;
  return [Math.min(p + 1, cur), Math.max(hi, cur)];
}
function drawBand(){
  if (!dragging) return;
  const t = boundaryY(dragging.lo) * scale, b = boundaryY(dragging.hi) * scale;
  const band = dragging.band;
  band.style.top = t + 'px'; band.style.height = Math.max(2, b - t) + 'px';
  if (!band.isConnected) $('overlay').insertBefore(band, $('overlay').firstChild);
}
function startDrag(e, i, el){
  e.preventDefault(); e.stopPropagation();
  const [lo, hi] = rangeFor(i);
  const band = document.createElement('div'); band.className = 'band';
  band.innerHTML = '<span>可移動範圍（後面的切割線會自動跟著調整）</span>';
  el.classList.add('dragging');
  dragging = {i, lo, hi, band, snapshot: cuts.slice()};
  drawBand();
  try { $('strip').setPointerCapture(e.pointerId); } catch(_) {}
}
function moveDrag(e){
  if (!dragging) return;
  const {i, lo, hi, snapshot} = dragging;
  const rect = $('strip').getBoundingClientRect();
  const y = (e.clientY - rect.top) / scale;
  let best = cuts[i], bd = Infinity;
  for (let k = lo; k <= hi; k++) { const d = Math.abs(boundaryY(k) - y); if (d < bd) { bd = d; best = k; } }
  if (best === cuts[i]) return;
  const next = reflow(snapshot.slice(0, i).concat(best), snapshot.slice(i + 1));
  const countChanged = next.length !== cuts.length;
  cuts = next;
  if (countChanged) { renderOverlay(); cutEls[i]?.classList.add('dragging'); drawBand(); }
  else positionOverlay();
  scheduleThumbs(); updateStat();
}
function endDrag(){
  if (!dragging) return;
  dragging.band.remove();
  cutEls.forEach(el => el.classList.remove('dragging'));
  dragging = null; renderThumbs();
}
window.addEventListener('pointermove', moveDrag);
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

$('strip').addEventListener('click', e => {
  if (e.target.closest('.cut-tools') || !lines.length || lines.length < 2) return;
  const rect = $('strip').getBoundingClientRect();
  const y = (e.clientY - rect.top) / scale;
  let best = -1, bd = Infinity;
  for (let k = 1; k < lines.length; k++) { const d = Math.abs(boundaryY(k) - y); if (d < bd) { bd = d; best = k; } }
  if (best < 0 || cuts.includes(best)) return;
  cuts.push(best); cuts.sort((a, b) => a - b);
  refreshCuts(); toast('已新增切割線');
});

function refreshCuts(){ renderOverlay(); renderThumbs(); updateStat(); }

/* ---------- thumbs ---------- */
let thumbRAF = 0;
function scheduleThumbs(){ if (thumbRAF) return; thumbRAF = requestAnimationFrame(() => { thumbRAF = 0; renderThumbs(); }); }
function renderThumbs(){
  const box = $('thumbs'); const N = segCount();
  while (box.children.length > N) box.lastChild.remove();
  const tw = 260, sc = tw / S.W, th = Math.round(S.H * sc);
  for (let j = 0; j < N; j++) {
    let b = box.children[j];
    if (!b) {
      b = document.createElement('button'); b.className = 'thumb';
      b.innerHTML = '<canvas></canvas><span></span>';
      b.addEventListener('click', () => jumpTo([...box.children].indexOf(b)));
      box.appendChild(b);
    }
    const c = b.querySelector('canvas');
    if (c.width !== tw || c.height !== th) { c.width = tw; c.height = th; }
    renderCard(c.getContext('2d'), j, sc);
    b.querySelector('span').textContent = `第 ${j+1} 張 · ${fillPct(j)}%`;
    b.setAttribute('aria-label', `第 ${j+1} 張圖卡`);
  }
}
function jumpTo(j){
  const rect = $('strip').getBoundingClientRect();
  const y = window.scrollY + rect.top + segTopCard(j) * scale - 90;
  window.scrollTo({top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

function updateStat(){
  const N = segCount();
  $('stat').innerHTML = `<b>${N}</b> 張 · ${S.W}×${S.H}`;
  $('exportBtn').disabled = !N;
  const chars = S.text.replace(/[\s*＊]/g, '').length;
  $('count').textContent = ` 目前 ${chars} 字。`;
  const w = $('warn');
  if (overflowWarn) { w.hidden = false; w.textContent = '字級太大或圖片太矮，有一行放不進一張圖。請調小字級、行高或上下邊距。'; }
  else w.hidden = true;
}

/* ---------- layout pipeline ---------- */
async function ensureFont(){
  const f = font(); if (f.system || f.custom) return true;
  const chars = [...new Set(S.text.replace(/\s/g, ''))].join('').slice(0, 4000) || '字';
  const spec = `${S.weight} ${S.size}px "${f.id}"`;
  try { await Promise.race([document.fonts.load(spec, chars), new Promise(r => setTimeout(r, 6000))]); } catch(e) {}
  try { return document.fonts.check(spec, chars); } catch(e) { return true; }
}
let layoutT, layoutSeq = 0;
function scheduleLayout(delay = 140){ clearTimeout(layoutT); layoutT = setTimeout(doLayout, delay); }
async function doLayout(){
  const seq = ++layoutSeq;
  const ready = await ensureFont();
  if (seq !== layoutSeq) return;
  layoutFontReady = ready;
  computeLayout(); autoCut();
  renderStrip(); renderOverlay(); renderThumbs(); updateStat();
}
function repaint(){ renderStrip(); positionOverlay(); renderThumbs(); }
document.fonts.addEventListener?.('loadingdone', () => { if (!layoutFontReady) scheduleLayout(60); });
new ResizeObserver(() => { if (lines.length) { renderStrip(); positionOverlay(); } }).observe($('mat'));

/* ---------- controls ---------- */
function syncControls(){
  $('src').value = S.text;
  $('W').value = S.W; $('H').value = S.H;
  $('family').value = S.family;
  for (const k of ['size','lh','pgap','padX','padY']) $(k).value = S[k];
  updateOutputs();
  for (const k of ['bg','dark','light']) $(k).value = S[k];
  $('pageNum').checked = S.pageNum;
  markSegs(); markChips(); markSwatches();
}
function updateOutputs(){
  $('o-size').textContent = S.size + 'px';
  $('o-lh').textContent = (+S.lh).toFixed(2);

/* ---------- image to text (OCR) ---------- */
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessWorker = null, ocrProgress = () => {}, ocrBusy = false, ocrUrls = [];
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('無法載入辨識程式，請確認網路連線')); document.head.appendChild(s); }); }
async function getWorker(){

    try { tessWorker = await Tesseract.createWorker('chi_tra', 1, { logger: m => ocrProgress(m) }); }
    catch(e) { tessWorker = null; throw new Error('無法下載中文辨識資料。請確認是用 Safari 或 Chrome 開啟網址（不要在 App 內的預覽或 LINE、IG 內建瀏覽器），並確定有連上網路。'); }

const isCJK = c => /[㐀-鿿豈-﫿　-〿＀-￯]/.test(c);

const HEIC_URL = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';

  const url = URL.createObjectURL(blob);

    const img = new Image(); img.src = url;
    await (img.decode ? img.decode() : new Promise((r, j) => { img.onload = r; img.onerror = j; }));

  } catch(e) {}
  return null;
}
async function decodeImage(file){

    try {
      if (!window.heic2any) await loadScript(HEIC_URL);
      const out = await heic2any({blob:file, toType:'image/jpeg', quality:0.92});
      blob = Array.isArray(out) ? out[0] : out;
      r = await tryDecode(blob);
    } catch(e) {}

function findBg(data, W, H){

}

// Pick a blank row in the lower half of the window to end this piece.
function blankRow(contrast, W, H){
  let best = H, bv = Infinity;

    let n = 0; const o = y * W; for (let x = 0; x < W; x += 2) if (contrast[o + x] > 40) n++;

  }

function symbolStrength(P, b){
  const {W, contrast} = P, vals = [];
  for (let y = Math.max(0, b.y0); y < Math.min(P.H, b.y1); y++) for (let x = Math.max(0, b.x0); x < Math.min(W, b.x1); x++) { const d = contrast[y * W + x]; if (d > 25) vals.push(d); }
  if (!vals.length) return 0;
  vals.sort((a, b) => b - a);
  const k = Math.max(1, Math.floor(vals.length * 0.25));
  let s = 0; for (let i = 0; i < k; i++) s += vals[i];
  return s / k;

async function ocrOneImage(file, idx, count){

    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, winH);

function classifyLight(allSyms){
  for (const s of allSyms) s.light = false;
  const vals = allSyms.filter(s => isCJK(s.t) || isLatin(s.t)).map(s => s.s).filter(v => v > 0);
  if (vals.length < 4) return;

    for (const v of vals) { if (Math.abs(v - lo) < Math.abs(v - hi)) { sl += v; nl++; } else { sh += v; nh++; } }
    if (!nl || !nh) break;

  }
  const twoTones = hi - lo > 35 && lo / hi < 0.78;
  for (const s of allSyms) s.light = twoTones && Math.abs(s.s - lo) < Math.abs(s.s - hi);

  for (let i = 0; i < allSyms.length; i++) {
    const s = allSyms[i];
    if (isCJK(s.t) && !/[　-〿＀-￯]/.test(s.t)) continue;

function assemble(lines){

      if (!!s.light !== light) { out += '*'; light = !!s.light; }

  if (imgs.length && !(e.clipboardData.getData('text') || '').trim()) { e.preventDefault(); runOCR(imgs); }
});

/* ---------- boot ---------- */
buildControls(); syncControls(); doLayout();
})();
</script>
