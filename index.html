<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="將長文或長圖整理成適合手機閱讀的多張圖卡。" />
  <title>分頁｜長文圖卡工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2321262e'/%3E%3Cpath d='M18 16h28v9H18zm0 14h20v7H18zm0 12h28v7H18z' fill='%23f4f1ea'/%3E%3Cpath d='M41 30h5v7h-5z' fill='%23e85d3f'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#20242a;--muted:#6f747b;--paper:#f2efe8;--card:#fff;--line:#d8d5ce;--accent:#e85d3f;--accent-soft:#f8ded5;--shadow:0 20px 60px rgba(30,34,39,.10);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,#fff 0,transparent 26rem),var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{max-width:1500px;margin:auto;padding:22px 26px 44px}.topbar{display:flex;align-items:center;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;font-size:1.15rem;font-weight:850;letter-spacing:.04em}.brandmark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center}.brandmark:after{content:"";width:16px;height:13px;border-block:3px solid #fff;box-shadow:0 4px 0 -1px var(--accent)}.privacy{margin-left:auto;color:var(--muted);font-size:.85rem}.tabs{display:flex;gap:5px;background:#dfdcd4;padding:5px;border-radius:15px;width:max-content;margin-bottom:18px}.tab{border:0;border-radius:11px;padding:10px 17px;color:#646970;background:transparent;font-weight:750}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 9px rgba(0,0,0,.08)}
    .workspace{display:grid;grid-template-columns:minmax(350px,430px) minmax(0,1fr);gap:18px;min-height:calc(100vh - 145px)}.panel{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:var(--shadow)}.controls{padding:23px;overflow:auto}.preview-panel{padding:18px;display:flex;flex-direction:column;min-width:0}.section-title{font-size:.78rem;letter-spacing:.12em;color:#858990;font-weight:850;text-transform:uppercase;margin:0 0 12px}.mode-copy{font-size:.92rem;color:var(--muted);line-height:1.65;margin:-2px 0 16px}.field{margin-bottom:17px}.field label,.label-row{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;font-weight:750;margin-bottom:8px}.hint{font-size:.76rem;color:#90949a;font-weight:500}.text-input{width:100%;min-height:245px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:#fbfaf7;color:var(--ink);padding:15px;line-height:1.7;outline:none}.text-input:focus,.select:focus,.number:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(32,36,42,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.select,.number{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 11px;outline:none}.color-line{display:flex;gap:9px}.color-wrap{height:42px;flex:1;border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;padding:5px 10px;gap:8px;background:#fff}.color-wrap input{width:25px;height:25px;border:0;padding:0;background:none}.range{width:100%;accent-color:var(--accent)}.action{width:100%;height:48px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-weight:800;box-shadow:0 9px 20px rgba(32,36,42,.18)}.action:hover{background:#0e1013}.action.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.action:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.drop{border:1.5px dashed #bdb9b0;border-radius:16px;padding:25px 18px;text-align:center;background:#faf9f6;transition:.15s}.drop.drag{border-color:var(--accent);background:var(--accent-soft)}.drop input{display:none}.drop strong{display:block;font-size:.95rem;margin-bottom:6px}.drop span{color:var(--muted);font-size:.81rem}.upload-btn{display:inline-flex;margin-top:13px;border:0;border-radius:10px;background:var(--ink);color:#fff;padding:9px 14px;font-weight:750}
    .preview-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.preview-head h2{font-size:1rem;margin:0}.badge{font-size:.75rem;color:#a13e2a;background:var(--accent-soft);padding:5px 9px;border-radius:999px;font-weight:750}.zoom{margin-left:auto;display:flex;gap:4px}.icon-btn{width:35px;height:35px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:900;color:#555}.stage{flex:1;min-height:520px;background:#d9d7d1;border-radius:15px;overflow:auto;padding:26px;position:relative}.canvas-wrap{margin:auto;position:relative;box-shadow:0 12px 34px rgba(0,0,0,.2);transform-origin:top center}.canvas-wrap canvas{display:block;width:100%;height:auto}.cuts{position:absolute;inset:0;pointer-events:none}.cut{position:absolute;left:-10px;right:-10px;height:3px;background:var(--accent);pointer-events:auto;cursor:ns-resize;touch-action:none}.cut:before,.cut:after{content:"";position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff}.cut:before{left:0}.cut:after{right:0}.cut-label{position:absolute;right:14px;top:-25px;background:var(--accent);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px}.empty{height:100%;min-height:460px;display:grid;place-items:center;text-align:center;color:#73777d}.empty-icon{width:70px;height:80px;border:2px solid #aaa;border-radius:9px;margin:auto auto 15px;position:relative;background:rgba(255,255,255,.35)}.empty-icon:after{content:"";position:absolute;left:13px;right:13px;top:23px;height:2px;background:#aaa;box-shadow:0 13px #aaa,0 26px #aaa}.empty p{margin:5px;line-height:1.55}.ocr-status{margin-top:12px;font-size:.82rem;color:var(--muted)}.progress{height:6px;background:#e4e1da;border-radius:99px;margin-top:8px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:.2s}.hidden{display:none!important}.notice{font-size:.78rem;line-height:1.55;color:var(--muted);background:#f5f3ee;border-radius:10px;padding:10px;margin-top:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#20242a;color:#fff;padding:11px 16px;border-radius:11px;font-size:.86rem;opacity:0;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:820px){.app{padding:14px}.privacy{display:none}.tabs{width:100%;overflow:auto}.tab{flex:1;white-space:nowrap;padding-inline:11px}.workspace{grid-template-columns:1fr}.preview-panel{min-height:600px}.stage{padding:16px}.controls{max-height:none}.row{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="brandmark"></span>分頁</div><div class="privacy">所有內容只在你的裝置上處理</div></header>
  <nav class="tabs" aria-label="工具模式">
    <button class="tab active" data-mode="text">文字轉圖卡</button><button class="tab" data-mode="split">長圖切割</button><button class="tab" data-mode="ocr">圖片辨識轉圖卡</button>
  </nav>
  <div class="workspace">
    <section class="panel controls">
      <div id="textSection">
        <p class="section-title">輸入內容</p><p class="mode-copy">用半形米字號 * 夾住的文字會套用淺色，其餘維持深色。</p>
        <div class="field"><textarea id="textInput" class="text-input" placeholder="貼上長文，例如：&#10;&#10;這是主要段落。&#10;&#10;*這段會以淺色顯示。*&#10;&#10;下一個段落會自動避開切割線。"></textarea></div>
      </div>
      <div id="uploadSection" class="hidden">
        <p class="section-title" id="uploadTitle">上傳長圖</p><p class="mode-copy" id="uploadCopy">先依設定高度自動切割，再拖動預覽中的紅線微調。</p>
        <label class="drop" id="drop"><input id="fileInput" type="file" accept="image/*"><strong>拖放長圖到這裡</strong><span>支援 JPG、PNG、WebP</span><span class="upload-btn">選擇圖片</span></label>
        <div id="ocrStatus" class="ocr-status hidden"><span id="ocrText">準備辨識…</span><div class="progress"><i id="ocrBar"></i></div></div>
      </div>
      <div id="ocrEdit" class="hidden"><div class="field" style="margin-top:16px"><div class="label-row"><label for="ocrInput">辨識後文字</label><span class="hint">可直接修正</span></div><textarea id="ocrInput" class="text-input" style="min-height:180px"></textarea></div></div>
      <p class="section-title" style="margin-top:22px">圖卡設定</p>
      <div class="row field"><div><label for="width">寬度</label><input class="number" id="width" type="number" min="320" max="2400" value="1080"></div><div><label for="height">每張高度</label><input class="number" id="height" type="number" min="400" max="3200" value="1440"></div></div>
      <div id="textSettings">
        <div class="row field"><div><label for="fontSize">文字大小</label><input class="number" id="fontSize" type="number" min="18" max="120" value="42"></div><div><label for="fontFamily">字體</label><select class="select" id="fontFamily"><option value="sans">黑體</option><option value="serif">明體</option><option value="rounded">圓體</option><option value="mono">等寬體</option></select></div></div>
        <div class="field"><div class="label-row"><label for="padding">內距</label><span class="hint"><span id="paddingValue">96</span> px</span></div><input id="padding" class="range" type="range" min="32" max="180" value="96"></div>
        <div class="field"><div class="label-row"><span>顏色</span><span class="hint">背景／深色字／淺色字</span></div><div class="color-line"><label class="color-wrap"><input type="color" id="bg" value="#f7f3ea"><span id="bgHex">#F7F3EA</span></label><label class="color-wrap"><input type="color" id="dark" value="#252525"><span>深</span></label><label class="color-wrap"><input type="color" id="light" value="#a39e96"><span>淺</span></label></div></div>
      </div>
      <button id="generate" class="action">產生切割預覽</button>
      <div class="actions"><button id="resetCuts" class="action secondary" disabled>重新自動切割</button><button id="download" class="action" disabled>存到相簿／分享</button></div>
      <div class="notice">拖動紅色切割線即可微調。手機會開啟系統分享選單，請選「儲存影像」或照片 App；若瀏覽器不支援，才會改用下載。</div>
    </section>
    <section class="panel preview-panel"><div class="preview-head"><h2>切割預覽</h2><span class="badge" id="count">尚未產生</span><div class="zoom"><button class="icon-btn" id="zoomOut" aria-label="縮小">−</button><button class="icon-btn" id="zoomIn" aria-label="放大">＋</button></div></div><div class="stage" id="stage"><div class="empty" id="empty"><div><div class="empty-icon"></div><p><strong>內容會在這裡排成長圖</strong></p><p>產生後可直接拖動切割線</p></div></div><div class="canvas-wrap hidden" id="canvasWrap"><canvas id="canvas"></canvas><div class="cuts" id="cuts"></div></div></div></section>
  </div>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={mode:'text',sourceCanvas:null,cuts:[],zoom:1,img:null,paragraphEnds:[],ocrEngine:null,ocrTimer:null,outputFiles:null,outputTimer:null};
const fonts={sans:'"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif',serif:'"Noto Serif TC","Songti TC","PMingLiU",serif',rounded:'"Arial Rounded MT Bold","PingFang TC",sans-serif',mono:'"Noto Sans Mono CJK TC","Microsoft JhengHei",monospace'};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function setMode(mode){state.mode=mode;$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('#textSection').classList.toggle('hidden',mode!=='text');$('#uploadSection').classList.toggle('hidden',mode==='text');$('#ocrEdit').classList.toggle('hidden',mode!=='ocr'||!$('#ocrInput').value);$('#textSettings').classList.toggle('hidden',mode==='split');$('#uploadTitle').textContent=mode==='ocr'?'上傳要辨識的長圖':'上傳長圖';$('#uploadCopy').textContent=mode==='ocr'?'會分析文字深淺並還原成 *淺色文字*，辨識後仍可手動修正。':'先依設定高度自動切割，再拖動預覽中的紅線微調。';$('#generate').textContent=mode==='ocr'?'辨識並產生預覽':'產生切割預覽';clearPreview()}
$$('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function clearPreview(){state.sourceCanvas=null;state.cuts=[];$('#canvasWrap').classList.add('hidden');$('#empty').classList.remove('hidden');$('#download').disabled=true;$('#resetCuts').disabled=true;$('#count').textContent='尚未產生'}
function parseRuns(text){let light=false,buf='',out=[];for(const ch of text){if(ch==='*'){if(buf)out.push({text:buf,light});buf='';light=!light}else buf+=ch}if(buf)out.push({text:buf,light});return out}
function hexToRgb(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255]}
function blend(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}
function makeTextCanvas(text){const w=clamp(+$('#width').value,320,2400), targetH=clamp(+$('#height').value,400,3200), fs=clamp(+$('#fontSize').value,18,120),pad=clamp(+$('#padding').value,32,180),lh=Math.round(fs*1.72);const family=fonts[$('#fontFamily').value];const measure=document.createElement('canvas').getContext('2d');measure.font=`500 ${fs}px ${family}`;const max=w-pad*2;let lines=[],line=[],lineW=0,paragraphEnds=[];const paras=text.replace(/\r/g,'').split('\n');paras.forEach((p,pi)=>{if(!p.trim()){lines.push([]);paragraphEnds.push(lines.length);return}const runs=parseRuns(p);for(const run of runs){for(const ch of [...run.text]){const cw=measure.measureText(ch).width;if(line.length&&lineW+cw>max){lines.push(line);line=[];lineW=0}line.push({ch,light:run.light,w:cw});lineW+=cw}}if(line.length){lines.push(line);line=[];lineW=0}paragraphEnds.push(lines.length);if(pi<paras.length-1)lines.push([])});const h=Math.max(targetH, pad*2+lines.length*lh);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle=$('#bg').value;ctx.fillRect(0,0,w,h);ctx.font=`500 ${fs}px ${family}`;ctx.textBaseline='top';let y=pad;lines.forEach(items=>{let x=pad;if(!items.length){y+=Math.round(lh*.62);return}for(const it of items){ctx.fillStyle=it.light?$('#light').value:$('#dark').value;ctx.fillText(it.ch,x,y);x+=it.w}y+=lh});state.paragraphEnds=paragraphEnds.map(i=>pad+i*lh).filter(y=>y>pad&&y<h-pad/2);return c}
function copyImageToCanvas(img){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);state.paragraphEnds=[];return c}
function clamp(v,a,b){return Math.min(b,Math.max(a,Number.isFinite(v)?v:a))}
function smartCuts(total,target){let cuts=[],y=target,minGap=Math.max(160,target*.35);while(y<total-80){let best=y;if(state.paragraphEnds.length){const near=state.paragraphEnds.filter(v=>Math.abs(v-y)<target*.22&&(v-(cuts.at(-1)||0))>minGap);if(near.length)best=near.sort((a,b)=>Math.abs(a-y)-Math.abs(b-y))[0]}cuts.push(Math.round(best));y=best+target}return cuts}
function showCanvas(c){state.sourceCanvas=c;const view=$('#canvas');view.width=c.width;view.height=c.height;view.getContext('2d').drawImage(c,0,0);$('#canvasWrap').style.width=Math.min(c.width,620)+'px';$('#canvasWrap').classList.remove('hidden');$('#empty').classList.add('hidden');$('#download').disabled=false;$('#resetCuts').disabled=false;requestAnimationFrame(()=>{resetCuts();setZoom(state.zoom);$('#stage').scrollTop=0})}
function resetCuts(){if(!state.sourceCanvas)return;state.cuts=smartCuts(state.sourceCanvas.height,clamp(+$('#height').value,400,3200));renderCuts()}
function renderCuts(){const layer=$('#cuts');layer.innerHTML='';const scale=layer.clientHeight/state.sourceCanvas.height;state.cuts.forEach((y,i)=>{const e=document.createElement('div');e.className='cut';e.style.top=(y*scale-1)+'px';e.innerHTML=`<span class="cut-label">${i+1}／${state.cuts.length+1}</span>`;let startY,start;const move=ev=>{const p=ev.touches?.[0]||ev;const dy=(p.clientY-startY)/scale;const lo=(i?state.cuts[i-1]:0)+80,hi=(i<state.cuts.length-1?state.cuts[i+1]:state.sourceCanvas.height)-80;state.cuts[i]=Math.round(clamp(start+dy,lo,hi));e.style.top=(state.cuts[i]*scale-1)+'px'};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('touchmove',move);window.removeEventListener('touchend',up);renderCuts()};const down=ev=>{ev.preventDefault();const p=ev.touches?.[0]||ev;startY=p.clientY;start=state.cuts[i];window.addEventListener(ev.type==='touchstart'?'touchmove':'pointermove',move,{passive:false});window.addEventListener(ev.type==='touchstart'?'touchend':'pointerup',up)};e.addEventListener('pointerdown',down);e.addEventListener('touchstart',down,{passive:false});layer.appendChild(e)});$('#count').textContent=`${state.cuts.length+1} 張圖片`;state.outputFiles=null;clearTimeout(state.outputTimer);state.outputTimer=setTimeout(async()=>{try{state.outputFiles=await makeOutputFiles()}catch{}},300)}
function setZoom(z){state.zoom=clamp(z,.45,1.5);$('#canvasWrap').style.transform=`scale(${state.zoom})`;$('#canvasWrap').style.marginBottom=`${($('#canvasWrap').offsetHeight*(state.zoom-1))}px`}
$('#zoomIn').onclick=()=>setZoom(state.zoom+.1);$('#zoomOut').onclick=()=>setZoom(state.zoom-.1);$('#resetCuts').onclick=resetCuts;
function loadFile(file){if(!file||!file.type.startsWith('image/')){toast('請選擇圖片檔');return}const img=new Image();img.onload=()=>{state.img=img;toast(`已載入 ${img.naturalWidth} × ${img.naturalHeight}`);if(state.mode==='split')showCanvas(copyImageToCanvas(img))};img.onerror=()=>toast('圖片無法讀取');img.src=URL.createObjectURL(file)}
$('#fileInput').onchange=e=>loadFile(e.target.files[0]);const drop=$('#drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
async function loadPaddleOCR(){if(state.ocrEngine)return state.ocrEngine;const mod=await import('https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm');state.ocrEngine=await mod.PaddleOCR.create({lang:'ch',ocrVersion:'PP-OCRv5',ortOptions:{backend:'wasm',wasmPaths:'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/',numThreads:1,simd:true}});return state.ocrEngine}
function makeOCRChunks(source){const scale=Math.min(4,Math.max(1,1000/source.width)),chunkH=Math.max(240,Math.floor(2200/scale)),overlap=Math.min(48,Math.floor(chunkH*.08)),chunks=[];for(let y=0;y<source.height;y+=Math.max(1,chunkH-overlap)){const h=Math.min(chunkH,source.height-y),c=document.createElement('canvas');c.width=Math.round(source.width*scale);c.height=Math.round(h*scale);const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(source,0,y,source.width,h,0,0,c.width,c.height);chunks.push({canvas:c,y,h,scale,overlap});if(y+h>=source.height)break}return chunks}
function polyBox(poly){const xs=[],ys=[];(poly||[]).forEach(p=>{xs.push(Array.isArray(p)?p[0]:p.x);ys.push(Array.isArray(p)?p[1]:p.y)});return {x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}}
function regionShade(canvas,box){const x=Math.max(0,Math.floor(box.x0)),y=Math.max(0,Math.floor(box.y0)),w=Math.max(1,Math.min(canvas.width-x,Math.ceil(box.x1-box.x0))),h=Math.max(1,Math.min(canvas.height-y,Math.ceil(box.y1-box.y0))),d=canvas.getContext('2d',{willReadFrequently:true}).getImageData(x,y,w,h).data;let sum=0,n=0;for(let i=0;i<d.length;i+=16){const lum=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];if(lum<235){sum+=lum;n++}}return n?sum/n:255}
function shadeSplit(values){if(values.length<2)return Infinity;let a=Math.min(...values),b=Math.max(...values);for(let n=0;n<8;n++){let as=0,an=0,bs=0,bn=0;values.forEach(v=>{if(Math.abs(v-a)<Math.abs(v-b)){as+=v;an++}else{bs+=v;bn++}});if(an)a=as/an;if(bn)b=bs/bn}return Math.abs(b-a)<16?Infinity:(a+b)/2}
async function runOCR(){if(!state.img){toast('請先選擇長圖');return}$('#ocrStatus').classList.remove('hidden');$('#generate').disabled=true;$('#ocrBar').style.width='4%';$('#ocrText').textContent='載入 PaddleOCR 繁體中文模型…';try{const engine=await loadPaddleOCR();$('#ocrBar').style.width='12%';const source=copyImageToCanvas(state.img),chunks=makeOCRChunks(source),items=[];for(let i=0;i<chunks.length;i++){const ch=chunks[i];$('#ocrText').textContent='辨識第 '+(i+1)+'／'+chunks.length+' 段…';$('#ocrBar').style.width=(12+Math.round(i/chunks.length*78))+'%';const results=await engine.predict(ch.canvas,{textDetLimitSideLen:1600,textDetMaxSideLimit:2400,textRecScoreThresh:.3});const result=results[0]||{items:[]};(result.items||[]).forEach(item=>{const p=polyBox(item.poly);if(!Number.isFinite(p.x0))return;const box={x0:p.x0/ch.scale,y0:p.y0/ch.scale+ch.y,x1:p.x1/ch.scale,y1:p.y1/ch.scale+ch.y};const cy=(box.y0+box.y1)/2,edge=ch.overlap*.45;if(ch.y>0&&cy<ch.y+edge)return;if(ch.y+ch.h<source.height&&cy>ch.y+ch.h-edge)return;items.push({text:String(item.text||'').trim(),score:item.score||0,box,shade:regionShade(source,box)})})}const clean=items.filter(x=>x.text&&x.score>=.2).sort((a,b)=>Math.abs(a.box.y0-b.box.y0)>8?a.box.y0-b.box.y0:a.box.x0-b.box.x0);if(!clean.length)throw new Error('沒有辨識到文字');const threshold=shadeSplit(clean.map(x=>x.shade));const out=clean.map(x=>x.shade>threshold?'*'+x.text+'*':x.text).join('\n');$('#ocrInput').value=out;$('#ocrEdit').classList.remove('hidden');$('#ocrText').textContent='辨識完成，可先修正文字再輸出';$('#ocrBar').style.width='100%';showCanvas(makeTextCanvas(out));requestAnimationFrame(()=>$('#canvasWrap').scrollIntoView({behavior:'smooth',block:'start'}));toast('PaddleOCR 辨識完成')}catch(err){console.error(err);$('#ocrText').textContent='辨識未完成：'+(err?.message||'模型載入失敗');toast('辨識失敗，請確認網路後重試')}finally{$('#generate').disabled=false}}
$('#generate').onclick=()=>{if(state.mode==='text'){const text=$('#textInput').value.trim();if(!text)return toast('請先貼上文字');showCanvas(makeTextCanvas(text))}else if(state.mode==='split'){if(!state.img)return toast('請先選擇長圖');showCanvas(copyImageToCanvas(state.img))}else runOCR()};
$('#ocrInput').addEventListener('input',()=>{clearTimeout(state.ocrTimer);state.ocrTimer=setTimeout(()=>showCanvas(makeTextCanvas($('#ocrInput').value)),350)});
$('#padding').oninput=e=>$('#paddingValue').textContent=e.target.value;$('#bg').oninput=e=>$('#bgHex').textContent=e.target.value.toUpperCase();
async function makeOutputFiles(){const ys=[0,...state.cuts,state.sourceCanvas.height],files=[];for(let i=0;i<ys.length-1;i++){const h=ys[i+1]-ys[i],c=document.createElement('canvas');c.width=state.sourceCanvas.width;c.height=h;c.getContext('2d').drawImage(state.sourceCanvas,0,ys[i],c.width,h,0,0,c.width,h);const blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('圖片建立失敗')),'image/png'));files.push(new File([blob],'圖卡_'+String(i+1).padStart(2,'0')+'.png',{type:'image/png'}))}return files}
async function fallbackDownloads(files){for(const file of files){const a=document.createElement('a'),url=URL.createObjectURL(file);a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);await new Promise(r=>setTimeout(r,180))}toast('瀏覽器不支援相簿分享，已改用下載')}
async function saveImages(){if(!state.sourceCanvas)return;$('#download').disabled=true;try{const files=state.outputFiles||await makeOutputFiles();if(navigator.share&&navigator.canShare?.({files})){await navigator.share({files,title:'分頁圖卡',text:'選擇「儲存影像」即可加入手機相簿'});toast('已交給手機處理')}else await fallbackDownloads(files)}catch(err){if(err?.name!=='AbortError'){console.error(err);toast('無法開啟分享，請再試一次')}}finally{$('#download').disabled=false}}
$('#download').onclick=saveImages;
function registerWebMCP(){const c=document.modelContext;if(!c?.registerTool)return;try{c.registerTool({name:'stage_text_cards',title:'產生文字圖卡預覽',description:'將帶有 *淺色段落* 標記的文字放入編輯器並產生切割預覽。',inputSchema:{type:'object',properties:{text:{type:'string'},width:{type:'number'},height:{type:'number'}},required:['text'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute:async input=>{setMode('text');$('#textInput').value=String(input.text||'');if(input.width)$('#width').value=clamp(input.width,320,2400);if(input.height)$('#height').value=clamp(input.height,400,3200);showCanvas(makeTextCanvas($('#textInput').value));return {cards:state.cuts.length+1,width:state.sourceCanvas.width,height:state.sourceCanvas.height}}})}catch(e){console.debug(e)}}registerWebMCP();
</script>
